<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <rect width="900" height="560" fill="#070d07"/>

  <!-- Title -->
  <text x="450" y="38" fill="#00ee77" font-size="22" font-weight="bold" text-anchor="middle" letter-spacing="3">MOTOR SPEED CONTROL — SYSTEM ARCHITECTURE</text>
  <line x1="60" y1="52" x2="840" y2="52" stroke="#142014" stroke-width="1"/>

  <!-- Layer 1: HMI -->
  <rect x="80" y="80" width="320" height="110" rx="4" fill="#090f09" stroke="#00ff88" stroke-width="1.5"/>
  <text x="240" y="106" fill="#00ff88" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">WEB HMI (Browser)</text>
  <text x="240" y="128" fill="#3a6a3a" font-size="11" text-anchor="middle">motor_hmi_v3.html</text>
  <text x="240" y="148" fill="#2a5a2a" font-size="10" text-anchor="middle">Gauges · Trend charts · PID tuning sliders</text>
  <text x="240" y="166" fill="#2a5a2a" font-size="10" text-anchor="middle">Live mode + simulation fallback</text>
  <text x="240" y="182" fill="#1a4a1a" font-size="9" text-anchor="middle">HTML5 Canvas · vanilla JS</text>

  <!-- Layer 2: Bridge -->
  <rect x="80" y="250" width="320" height="110" rx="4" fill="#090f09" stroke="#00aaff" stroke-width="1.5"/>
  <text x="240" y="276" fill="#00aaff" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">BRIDGE (Flask)</text>
  <text x="240" y="298" fill="#3a6a3a" font-size="11" text-anchor="middle">bridge.py · pymodbus 3.x</text>
  <text x="240" y="318" fill="#2a5a2a" font-size="10" text-anchor="middle">REST API ⇄ Modbus TCP translation</text>
  <text x="240" y="336" fill="#2a5a2a" font-size="10" text-anchor="middle">/state /setpoint /enable /pid</text>
  <text x="240" y="352" fill="#1a4a1a" font-size="9" text-anchor="middle">100 ms poll loop · CORS enabled</text>

  <!-- Layer 3: PLC runtime -->
  <rect x="500" y="250" width="320" height="110" rx="4" fill="#090f09" stroke="#ffaa00" stroke-width="1.5"/>
  <text x="660" y="276" fill="#ffaa00" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">OpenPLC RUNTIME</text>
  <text x="660" y="298" fill="#3a6a3a" font-size="11" text-anchor="middle">./core/openplc (C++, RT thread)</text>
  <text x="660" y="318" fill="#2a5a2a" font-size="10" text-anchor="middle">Modbus TCP server · 10 ms scan</text>
  <text x="660" y="336" fill="#2a5a2a" font-size="10" text-anchor="middle">compiled from motor_control.st</text>
  <text x="660" y="352" fill="#1a4a1a" font-size="9" text-anchor="middle">SCHED_FIFO · mlockall</text>

  <!-- Layer 4: Control logic -->
  <rect x="500" y="420" width="320" height="120" rx="4" fill="#090f09" stroke="#ff5577" stroke-width="1.5"/>
  <text x="660" y="446" fill="#ff5577" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">CONTROL LOGIC (ST)</text>
  <text x="660" y="468" fill="#2a5a2a" font-size="10" text-anchor="middle">Setpoint scaling → Ramp limiter</text>
  <text x="660" y="486" fill="#2a5a2a" font-size="10" text-anchor="middle">→ PID (anti-windup, filtered D)</text>
  <text x="660" y="504" fill="#2a5a2a" font-size="10" text-anchor="middle">→ Motor model (1st-order DC)</text>
  <text x="660" y="522" fill="#1a4a1a" font-size="9" text-anchor="middle">EMA filter · deadband · stall detect</text>

  <!-- Arrows: HMI <-> Bridge -->
  <line x1="240" y1="190" x2="240" y2="250" stroke="#00ff88" stroke-width="1.5"/>
  <polygon points="240,250 235,240 245,240" fill="#00ff88"/>
  <polygon points="240,190 235,200 245,200" fill="#00ff88"/>
  <rect x="250" y="205" width="135" height="30" rx="3" fill="#070d07" stroke="#142014"/>
  <text x="317" y="218" fill="#00ff88" font-size="9" text-anchor="middle">HTTP REST / JSON</text>
  <text x="317" y="230" fill="#1a4a1a" font-size="9" text-anchor="middle">localhost:5000</text>

  <!-- Arrows: Bridge <-> PLC -->
  <line x1="400" y1="305" x2="500" y2="305" stroke="#00aaff" stroke-width="1.5"/>
  <polygon points="500,305 490,300 490,310" fill="#00aaff"/>
  <polygon points="400,305 410,300 410,310" fill="#00aaff"/>
  <rect x="402" y="262" width="96" height="30" rx="3" fill="#070d07" stroke="#142014"/>
  <text x="450" y="275" fill="#00aaff" font-size="9" text-anchor="middle">Modbus TCP</text>
  <text x="450" y="287" fill="#1a4a1a" font-size="9" text-anchor="middle">localhost:502</text>

  <!-- Arrows: PLC <-> Control -->
  <line x1="660" y1="360" x2="660" y2="420" stroke="#ffaa00" stroke-width="1.5"/>
  <polygon points="660,420 655,410 665,410" fill="#ffaa00"/>
  <polygon points="660,360 655,370 665,370" fill="#ffaa00"/>
  <rect x="592" y="375" width="136" height="30" rx="3" fill="#070d07" stroke="#142014"/>
  <text x="660" y="388" fill="#ffaa00" font-size="9" text-anchor="middle">glueVars.cpp</text>
  <text x="660" y="400" fill="#1a4a1a" font-size="9" text-anchor="middle">%QW/%QX ⇄ buffers</text>

  <!-- Data flow legend -->
  <text x="80" y="420" fill="#1a4a1a" font-size="10" letter-spacing="2">DATA FLOW</text>
  <text x="80" y="442" fill="#3a6a3a" font-size="10">↓ writes:  setpoint, enable, Kp/Ki/Kd, accel</text>
  <text x="80" y="460" fill="#3a6a3a" font-size="10">↑ reads:   rpm, ramped SP, PWM%, fault</text>
  <line x1="80" y1="475" x2="420" y2="475" stroke="#142014" stroke-width="1"/>
  <text x="80" y="498" fill="#1a4a1a" font-size="10" letter-spacing="2">CONTROL LOOP</text>
  <text x="80" y="518" fill="#2a5a2a" font-size="10">10 ms scan · λ-tuned PI · ω = K·u/(τs+1)</text>
  <text x="80" y="534" fill="#1a4a1a" font-size="9">K=30 RPM/% · τ=0.5s · max 3000 RPM</text>
</svg>
